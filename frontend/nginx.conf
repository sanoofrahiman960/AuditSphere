# Serves the SPA and forwards API/admin/static requests to Django.
# TLS is terminated by the outer reverse proxy / load balancer (see docs/DEPLOYMENT.md).

# Keep the original scheme when an outer proxy sets it; otherwise use this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # keep above MAX_UPLOAD_SIZE_MB

    # add_header is not inherited by locations that define their own, so each location includes this.
    include /etc/nginx/security-headers.inc;

    location = /healthz { access_log off; return 200 "ok"; }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
